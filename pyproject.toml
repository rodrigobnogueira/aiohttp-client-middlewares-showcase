[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acm-showcase"
version = "0.1.0"
description = "A runnable exercise of every feature in aiohttp-client-middlewares"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.12",
  "aiohttp-client-middlewares @ git+https://github.com/aio-libs/aiohttp-client-middlewares@split-rate-limiter-abc",
]

[tool.setuptools.packages.find]
include = ["acm_showcase*"]

[tool.mypy]
strict = true
files = ["acm_showcase"]
