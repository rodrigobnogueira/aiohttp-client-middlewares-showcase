name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The library is pinned to master, so catch breakage even with no commits here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: pip install -e . mypy
      - run: python -m acm_showcase
      - run: mypy
